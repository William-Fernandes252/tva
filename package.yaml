name: tva-core-domain
version: 0.1.0.0
synopsis: Core domain types and logic for the video-processing service.
description: Shared domain types, business logic, and utilities for the tva video-processing service. Used by api-server, video-worker, and notifier-worker services.
license: MIT
license-file: LICENSE
author: William Fernandes Dias
maintainer: william.winchester1967@gmail.com
extra-doc-files:
  - CHANGELOG.md

language: GHC2021

dependencies:
  - base >= 4.17 && < 5
  - aeson
  - bytestring
  - hasql
  - rel8 >= 1.5
  - text >= 2.0
  - time >= 1.12
  - uuid >= 1.3
  - katip

library:
  source-dirs: core-domain/src
  exposed-modules:
    - Domain.Core
    - Domain.Database
    - Domain.Event
    - Domain.Logger
    - Domain.Queue
    - Domain.Storage
  ghc-options: -Wall
