version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: video_postgres
    environment:
      POSTGRES_USER: video_user
      POSTGRES_PASSWORD: video_password
      POSTGRES_DB: video_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_user -d video_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  dbmate:
    image: amacneil/dbmate:latest
    container_name: video_dbmate
    command: ["-d", "/database/migrations", "up"]
    environment:
      DATABASE_URL: "postgres://video_user:video_password@postgres:5432/video_db?sslmode=disable"
    volumes:
      - ./database:/database
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: video_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mq_user
      RABBITMQ_DEFAULT_PASS: mq_password
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: video_minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Utility container to create the buckets and configure webhooks on startup
  minio-init:
    image: minio/mc
    container_name: video_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minio_admin minio_password &&
      mc mb myminio/raw-videos --ignore-existing &&
      mc mb myminio/processed-videos --ignore-existing &&
      mc anonymous set public myminio/processed-videos &&
      mc admin config set myminio notify_webhook:1 endpoint='http://api-server:8080/webhook/minio' auth_token='Bearer test-secret' &&
      mc admin service restart myminio &&
      sleep 5 &&
      mc event add myminio/raw-videos arn:minio:sqs::1:webhook --event put
      "

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tva_api_server
    command: ["tva-api-server"]
    ports:
      - "8080:8080"
    volumes:
      - ./api-server/public:/app/public
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: video_user
      PG_PASS: video_password
      PG_DB: video_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: mq_user
      RABBITMQ_PASS: mq_password
      RABBITMQ_VHOST: "/"
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: raw-videos
      WEBHOOK_SECRET: "test-secret"
    depends_on:
      postgres:
        condition: service_healthy
      dbmate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tva_video_worker
    command: ["tva-video-worker"]
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: video_user
      PG_PASS: video_password
      PG_DB: video_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: mq_user
      RABBITMQ_PASS: mq_password
      RABBITMQ_VHOST: "/"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      dbmate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  notifier-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tva_notifier_worker
    command: ["tva-notifier-worker"]
    ports:
      - "8081:8081"
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: video_user
      PG_PASS: video_password
      PG_DB: video_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: mq_user
      RABBITMQ_PASS: mq_password
      RABBITMQ_VHOST: "/"
    depends_on:
      postgres:
        condition: service_healthy
      dbmate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data: