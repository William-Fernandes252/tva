version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: video_postgres_test
    environment:
      POSTGRES_USER: video_user
      POSTGRES_PASSWORD: video_password
      POSTGRES_DB: video_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_user -d video_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  dbmate:
    image: amacneil/dbmate:latest
    container_name: video_dbmate_test
    command: ["-d", "/database/migrations", "up"]
    environment:
      DATABASE_URL: "postgres://video_user:video_password@postgres:5432/video_db?sslmode=disable"
    volumes:
      - ./database:/database
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: video_rabbitmq_test
    environment:
      RABBITMQ_DEFAULT_USER: mq_user
      RABBITMQ_DEFAULT_PASS: mq_password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: video_minio_test
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc
    container_name: video_minio_init_test
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 minio_admin minio_password; do echo 'waiting for minio'; sleep 1; done &&
      mc mb myminio/raw-videos --ignore-existing &&
      mc mb myminio/processed-videos --ignore-existing &&
      mc anonymous set public myminio/processed-videos
      "

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tva_api_server_test
    command: ["tva-api-server"]
    ports:
      - "8080:8080"
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: video_user
      PG_PASS: video_password
      PG_DB: video_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: mq_user
      RABBITMQ_PASS: mq_password
      RABBITMQ_VHOST: "/"
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: raw-videos
      WEBHOOK_SECRET: "test-secret"
    depends_on:
      postgres:
        condition: service_healthy
      dbmate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tva_video_worker_test
    command: ["tva-video-worker"]
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: video_user
      PG_PASS: video_password
      PG_DB: video_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: mq_user
      RABBITMQ_PASS: mq_password
      RABBITMQ_VHOST: "/"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      dbmate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  notifier-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tva_notifier_worker_test
    command: ["tva-notifier-worker"]
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: video_user
      PG_PASS: video_password
      PG_DB: video_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: mq_user
      RABBITMQ_PASS: mq_password
      RABBITMQ_VHOST: "/"
    depends_on:
      postgres:
        condition: service_healthy
      dbmate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
